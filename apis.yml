x-enrichment-notes: >-
  IDENTITY REPAIR: this repo's only inherited pointer was a `Website` set to a Hiive secondary-market
  listing (https://www.hiive.com/securities/impulse-dynamics-stock). Because the security probes
  follow the Website pointer, the first probe pass produced a domain-security profile for hiive.com
  and attributed HIIVE's vulnerability disclosure programme (security@hiive.com, hiive.com/vdp) to
  Impulse Dynamics. Both artifacts were deleted and re-probed after Website was corrected to
  https://impulse-dynamics.com/ and the venue listing was demoted to SecondaryMarket.
  Deliberately absent, each a verified negative probed on 2026-08-23: WellKnown and SecurityTxt (all
  eight /.well-known/ paths returned a genuine 404 with an identical 548-byte body — not a soft-200
  catch-all); AgentCard (/.well-known/agent-card.json and /.well-known/agent.json both 404); ContentSignal
  (robots.txt is served and saved, but it is a stock allow-all Yoast block with no AI-preference or
  Content-Signal directive, so it is not a consent signal); Idempotency (no Idempotency-Key header or
  equivalent on any of the 420 discovered routes); SDKs and Packages (nothing first-party on npm, PyPI,
  RubyGems, crates.io or any registry); GitHubOrganization (no org at impulse-dynamics, impulsedynamics
  or ImpulseDynamics — all 404 from the GitHub API); StatusPage (status.impulse-dynamics.com does not
  resolve); Deprecation (no policy, no RFC 8594 Sunset header); TrustCenter and Compliance
  (trust.impulse-dynamics.com does not resolve, no SOC 2 / ISO 27001 / HIPAA attestation published —
  the company's FDA PMA, CE mark and NMPA approvals are medical-device regulatory facts, not an
  information-security compliance programme); AsyncAPI and Webhooks (no event surface); GraphQL,
  Protobuf and WSDL (none); Postman, Pricing, SignUp, Roadmap, Documentation, DeveloperPortal,
  APIReference, GettingStarted, CLI, Sandbox, Components and ChangeLog (the company publishes no
  developer surface of any kind). OAuthScopes is omitted on purpose: the mcp namespace is OAuth-guarded
  but no authorization-server metadata is published, so no real scope list exists to record.
  The Security pointer is the company's genuine, detailed vulnerability disclosure programme with two
  PGP-published contacts — a real medical-device VDP, notable because it is NOT discoverable via
  security.txt.

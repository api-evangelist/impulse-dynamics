aid: impulse-dynamics
name: Impulse Dynamics
description: >-
  Impulse Dynamics is a medical-device company that created Cardiac Contractility Modulation (CCM)
  therapy, delivered by the implantable Optimizer Smart and Optimizer Smart Mini pulse generators for
  patients with moderate-to-severe chronic heart failure who remain symptomatic despite
  guideline-directed medical therapy. Incorporated in 1997, with US headquarters in Marlton, New
  Jersey, the company won the first-ever FDA Breakthrough Device designation and received FDA
  approval for the Optimizer Smart in March 2019; the device has been CE marked since October 2016
  and is now approved in more than 30 countries plus China. Impulse Dynamics operates no developer
  programme: there is no developer portal, API documentation, API reference, SDK, CLI, sandbox,
  pricing or sign-up, and nothing clinical or device-related is exposed as an API. It is catalogued
  here because its corporate website runs a live, anonymous, self-describing WordPress REST API
  advertising 420 routes across 30 namespaces, because that same install exposes two Model Context
  Protocol servers, and because the company publishes a substantive vulnerability disclosure
  programme with two PGP-published security contacts covering its medical devices, health software
  and infrastructure.

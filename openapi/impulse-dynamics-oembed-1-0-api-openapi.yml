openapi: 3.2.0
info:
  title: Impulse Dynamics WordPress REST Oembed/1.0 API
  version: wp/v2
  summary: The live WordPress REST API served by the Impulse Dynamics corporate website.
  description: Derived verbatim from the route-discovery document the Impulse Dynamics web server publishes at https://impulse-dynamics.com/wp-json/ (fetched 2026-08-23, HTTP 200).
  x-derived-from: https://impulse-dynamics.com/wp-json/

envelope:
  content_type: application/json
  shape: '{"code": "<machine string>", "message": "<human string>", "data": {"status": <http status>}}'
  note: >-
    The WordPress REST error envelope. It predates RFC 9457 and does not use application/problem+json:
    there is no `type` URI, no `title`, no `detail` and no `instance`. `code` is the stable machine
    identifier an agent should branch on; `message` is human prose and is localisable, so it must not
    be matched against.

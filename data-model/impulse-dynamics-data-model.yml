  Entity graph of the wp/v2 namespace on impulse-dynamics.com, derived from the route tree and the
  id-reference parameters WordPress declares on each route. The interesting part is not the WordPress
  core content model — it is the FIVE custom post types this company registered, because they are
  where Impulse Dynamics' own business data lives and they are readable anonymously: the clinic
  locator, the technical-document library, careers, news and in-the-media coverage.
